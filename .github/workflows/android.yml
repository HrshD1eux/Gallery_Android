name: Build, Sign & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: extract_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}')
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Extracted Version: ${VERSION_NAME} (Code: ${VERSION_CODE})"

      - name: Configure Keystore & Signing
        id: setup_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          data = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().replace(' ', '').replace('\n', '').replace('\r', '')
          if data:
              missing_padding = len(data) % 4
              if missing_padding:
                  data += '=' * (4 - missing_padding)
              with open('gallery-release.jks', 'wb') as f:
                  f.write(base64.b64decode(data))
              with open('keystore.properties', 'w') as f:
                  f.write(f'''storeFile=gallery-release.jks\nstorePassword={os.environ.get('RELEASE_KEYSTORE_PASSWORD')}\nkeyAlias={os.environ.get('RELEASE_KEY_ALIAS')}\nkeyPassword={os.environ.get('RELEASE_KEY_PASSWORD')}\n''')
              print('Keystore decoded and keystore.properties configured.')
          "

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        id: build_apk
        run: |
          if [ -f "keystore.properties" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "No keystore secrets found, falling back to assembleDebug..."
            ./gradlew assembleDebug
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Rename APK for Distribution
        run: |
          DIST_NAME="Gallery-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$DIST_NAME"
          echo "DIST_APK=${DIST_NAME}" >> $GITHUB_ENV
          echo "Prepared $DIST_NAME for upload."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-v${{ env.VERSION_NAME }}
          path: ${{ env.DIST_APK }}
          if-no-files-found: error

      - name: Create Git Tag & GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Gallery v${{ env.VERSION_NAME }}
          body: |
            ## 🖼️ Gallery v${{ env.VERSION_NAME }} Release
            
            ### ✨ Highlights
            * **High-Performance Timeline**: Jetpack Compose Lazy Staggered Grid with Paging 3 and fast $O(1)$ timeline scrubber.
            * **AES-256-GCM Encrypted Vault**: Hardware-backed KeyStore encryption with PBKDF2 PIN hashing (100,000 rounds) and persistent rate-limiting.
            * **Streaming Video Playback**: Progressive cipher streaming via ExoPlayer with minimal RAM consumption.
            * **Non-Destructive Editor & Tools**: Fast cropping, 90° rotation, memory-safe compressor, and duplicate photo finder.
            * **Modern Tooling**: Built with Kotlin Symbol Processing (KSP) and AndroidX Biometrics.
            
            ### 📦 Download & Install
            Download the attached `Gallery-v${{ env.VERSION_NAME }}.apk` below.
          files: ${{ env.DIST_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Bump Version for Next Build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IS_RELEASE == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          python3 -c "
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()
          
          # Increment versionCode
          code_match = re.search(r'versionCode = (\d+)', content)
          if code_match:
              old_code = int(code_match.group(1))
              new_code = old_code + 1
              content = re.sub(r'versionCode = \d+', f'versionCode = {new_code}', content)
          
          # Increment patch in versionName (e.g. 1.1.3 -> 1.1.4)
          name_match = re.search(r'versionName = \"(\d+\.\d+\.)(\d+)\"', content)
          if name_match:
              prefix = name_match.group(1)
              patch = int(name_match.group(2)) + 1
              new_name = f'{prefix}{patch}'
              content = re.sub(r'versionName = \"[^\"]+\"', f'versionName = \"{new_name}\"', content)
              print(f'Bumped version to {new_name} (Code: {new_code})')
          
          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          "
          
          git add app/build.gradle.kts
          git commit -m "chore: bump version for next build [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
