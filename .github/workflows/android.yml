name: Build, Sign & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: extract_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}')
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Extracted Version: ${VERSION_NAME} (Code: ${VERSION_CODE})"

      - name: Configure Keystore & Signing
        id: setup_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          data = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().replace(' ', '').replace('\n', '').replace('\r', '')
          if data:
              missing_padding = len(data) % 4
              if missing_padding:
                  data += '=' * (4 - missing_padding)
              with open('gallery-release.jks', 'wb') as f:
                  f.write(base64.b64decode(data))
              with open('keystore.properties', 'w') as f:
                  f.write(f'''storeFile=gallery-release.jks\nstorePassword={os.environ.get('RELEASE_KEYSTORE_PASSWORD')}\nkeyAlias={os.environ.get('RELEASE_KEY_ALIAS')}\nkeyPassword={os.environ.get('RELEASE_KEY_PASSWORD')}\n''')
              print('Keystore decoded and keystore.properties configured.')
          else:
              print('No RELEASE_KEYSTORE_BASE64 secret provided.')
          "

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        id: build_apk
        run: |
          if [ -f "keystore.properties" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "No keystore secrets found, building Debug APK..."
            ./gradlew assembleDebug
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            # Fallback search for any built APK
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK at: ${APK_PATH}"
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV

      - name: Rename APK for Distribution
        run: |
          DIST_NAME="Imava-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$DIST_NAME"
          echo "DIST_APK=${DIST_NAME}" >> $GITHUB_ENV
          echo "Prepared $DIST_NAME for distribution."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Imava-v${{ env.VERSION_NAME }}
          path: ${{ env.DIST_APK }}
          if-no-files-found: error

      - name: Prepare Release Notes
        id: prep_release_notes
        run: |
          python3 -c "
          import os
          body = ''
          if os.path.exists('RELEASE_NOTES.md'):
              with open('RELEASE_NOTES.md', 'r', encoding='utf-8') as f:
                  body = f.read().strip()
          
          if not body:
              body = '### What\'s New in Imava v${{ env.VERSION_NAME }}\n\nSee commits and release assets below.'
          
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          "

      - name: Create Git Tag & GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Imava v${{ env.VERSION_NAME }}
          body_path: release_body.md
          generate_release_notes: true
          files: ${{ env.DIST_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Bump Version for Next Build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          python3 -c "
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()
          
          # Increment versionCode
          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          if code_match:
              old_code = int(code_match.group(1))
              new_code = old_code + 1
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', content)
          
          # Increment patch in versionName (e.g. 1.1.3 -> 1.1.4)
          name_match = re.search(r'versionName\s*=\s*\"(\d+\.\d+\.)(\d+)\"', content)
          if name_match:
              prefix = name_match.group(1)
              patch = int(name_match.group(2)) + 1
              new_name = f'{prefix}{patch}'
              content = re.sub(r'versionName\s*=\s*\"[^\"]+\"', f'versionName = \"{new_name}\"', content)
              print(f'Successfully bumped version to {new_name} (versionCode: {new_code})')
          
          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          "
          
          git add app/build.gradle.kts
          git commit -m "chore: bump version for next build [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
